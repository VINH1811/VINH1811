name: Generate Datas

on:
  schedule: # Chạy tự động mỗi 12 tiếng
    - cron: "0 */12 * * *"
  
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:
  
  # Chạy mỗi khi có push lên nhánh main/master
  push:
    branches:
    - main
    - master

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - uses: actions/checkout@v3
    
      # Step 2: Generate the snake files
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            
      # Step 3: Push the generated SVG files to the output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
